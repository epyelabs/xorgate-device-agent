name: Device — deploy dev

# Builds the device agent and uploads the dist tarball to the dev S3 bucket
# (xorgate-device-dist-dev-<account>-<region>). install.sh (served per-request
# by `GET /get/:code` on the dev API) downloads the build from this bucket.
#
# # Prerequisites (one-time, manual)
#
# Since the 2026-08 account split each stage has its own AWS account and its
# own machine user, delivered via GitHub ENVIRONMENT secrets: the `development`
# environment holds the dev-account user's keys (this workflow), `production`
# holds the prod-account user's (device-deploy-prod.yml). Same secret names in
# both; the job's `environment:` selects which set a run gets.
#
#   1. An IAM machine user in the DEV account (111910761410) with an inline
#      policy granting:
#        - s3:PutObject, s3:PutObjectAcl, s3:DeleteObject on the dev dist
#          bucket ("/*" suffix)
#        - s3:ListBucket on the dev dist bucket (no suffix)
#        - cloudformation:DescribeStacks on XorgateCoreStorageStackDev (so we
#          read the dist bucket name from the stack output instead of
#          hard-coding it)
#      (The prod-account equivalent, xorgate-device-ci in 865609249890, is
#      described in device-deploy-prod.yml's header.)
#   2. Mint one access-key pair for that user.
#   3. Store as ENVIRONMENT secrets on `development` (Settings → Environments):
#        AWS_ACCESS_KEY_ID     = AKIA…
#        AWS_SECRET_ACCESS_KEY = the secret half
#      Optional repo VARIABLE (Variables tab), defaults to us-east-1:
#        AWS_REGION            = us-east-1
#
# Static keys are a temporary measure; migrate to GitHub OIDC later.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "systemd/**"
      - "python/**"
      - "modem/**"
      - "system/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/device-deploy-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-deploy-dev
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: development # scopes secrets.AWS_* to the dev-account machine user
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack tarball
        id: pack
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TARBALL="xorgate-agent-${SHORT_SHA}.tar.gz"
          # Bake the build's identity INTO the artifact: until now the sha lived
          # only in the S3 key and was discarded on extract, so an installed
          # device could not say which build it was running. dist/ is rewritten
          # by `npm run build`, so this manifest can never outlive its build.
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PKG_VERSION=$(node -p "require('./package.json').version")
          cat > dist/build-info.json <<EOF
          { "version": "$SHORT_SHA", "channel": "dev", "builtAt": "$BUILT_AT", "packageVersion": "$PKG_VERSION" }
          EOF
          # `python/` ships the BNO085 IMU helper the real-mode collector spawns;
          # `modem/` ships the SIM7600 connection-manager (daemon + systemd + udev)
          # the install script provisions for LTE uplink + GPS;
          # `media/` ships the KVS WebRTC runtime binary (+ user-supplied .so libs
          # under media/lib) the media collector supervises.
          tar -czf "$TARBALL" dist package.json package-lock.json systemd python modem media system
          echo "Contents:"
          tar -tzf "$TARBALL" | head -30
          # install.sh extracts to /opt/xorgate and expects these entries.
          tar -tzf "$TARBALL" | grep -q "^dist/worker.js$" || { echo "missing dist/worker.js"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^package.json$" || { echo "missing package.json"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^package-lock.json$" || { echo "missing package-lock.json"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^systemd/xorgate-agent.service$" || { echo "missing systemd unit"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^python/bno085_read.py$" || { echo "missing python/bno085_read.py"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^python/obd_read.py$" || { echo "missing python/obd_read.py"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^python/obd/session.py$" || { echo "missing python/obd/session.py"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^python/obd_scan.py$" || { echo "missing python/obd_scan.py"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^modem/sim7600-lte.sh$" || { echo "missing modem/sim7600-lte.sh"; exit 1; }
          tar -tzf "$TARBALL" | grep -q "^dist/build-info.json$" || { echo "missing dist/build-info.json"; exit 1; }
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "version=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "builtAt=$BUILT_AT" >> "$GITHUB_OUTPUT"
          echo "packageVersion=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve dist bucket from CloudFormation
        id: bucket
        env:
          STACK: XorgateCoreStorageStackDev
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DeviceDistBucketName'].OutputValue" \
            --output text)
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "could not resolve DeviceDistBucketName from $STACK"
            exit 1
          fi
          echo "Using dist bucket: $BUCKET"
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Upload to S3 (versioned + latest)
        env:
          BUCKET: ${{ steps.bucket.outputs.name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.pack.outputs.version }}
          BUILT_AT: ${{ steps.pack.outputs.builtAt }}
          PKG_VERSION: ${{ steps.pack.outputs.packageVersion }}
        run: |
          # Versioned tarball: immutable, cache forever.
          aws s3 cp "$TARBALL" "s3://$BUCKET/$TARBALL" \
            --cache-control "public,max-age=31536000,immutable" \
            --content-type "application/gzip"
          # `latest` alias: install.sh's default DIST_VERSION points here.
          aws s3 cp "$TARBALL" "s3://$BUCKET/xorgate-agent-latest.tar.gz" \
            --cache-control "no-cache" \
            --content-type "application/gzip"
          # latest.json describes exactly what the `latest` alias now points at —
          # written in THIS step so the manifest and the alias cannot drift.
          # `GET /device-dist/latest` serves it; the web UI diffs it against the
          # build a device reports.
          cat > latest.json <<EOF
          { "version": "$VERSION", "channel": "dev", "builtAt": "$BUILT_AT",
            "packageVersion": "$PKG_VERSION", "tarball": "$TARBALL" }
          EOF
          aws s3 cp latest.json "s3://$BUCKET/latest.json" \
            --cache-control "no-cache" \
            --content-type "application/json"

      - name: Summary
        if: always()
        env:
          BUCKET: ${{ steps.bucket.outputs.name }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          {
            echo "## Device dev deploy"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Bucket: \`$BUCKET\`"
            echo "- Tarballs:"
            echo "  - \`s3://$BUCKET/xorgate-agent-$VERSION.tar.gz\` (immutable)"
            echo "  - \`s3://$BUCKET/xorgate-agent-latest.tar.gz\` (alias)"
            echo "- Manifest: \`s3://$BUCKET/latest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
